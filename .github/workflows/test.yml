name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  multiverse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: multiverse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Test navigateur (lecteurs simulés)
        run: |
          npm i --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          npm run e2e
